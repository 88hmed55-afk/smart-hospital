name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build React UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Maven verify (unit tests + EAR)
        run: mvn -B -ntp clean verify

      - name: Upload EAR
        uses: actions/upload-artifact@v4
        with:
          name: smart-hospital-ear
          path: smart-hospital-ear/target/smart-hospital.ear
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: smart-hospital-web/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14
