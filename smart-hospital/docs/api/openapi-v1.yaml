openapi: 3.1.0
info:
  title: Smart Hospital API
  version: 1.0.0
  description: Academic Smart Hospital REST API. Includes branch-scoped patient access, physician-led encounters, 
    assigned nursing care teams, laboratory orders, specimen processing, independent result review, patient-minimal lab 
    identifiers, asynchronous laboratory notifications, physician prescriptions, FEFO pharmacy dispensing, idempotent 
    dispense requests and stock-ledger safeguards; inpatient admission and bed allocation; service invoices and payment 
    posting with database-enforced financial integrity; branch-scoped operational analytics, historical metric 
    snapshots, pharmacy reorder thresholds and explainable decision cards; authenticated self-session identity 
    projection; supplier directory, approved purchase orders, batch-aware goods receiving and stock-ledger posting. 
    Local GlassFish BASIC authentication is for isolated development only; use HTTPS and a production identity provider 
    before any real deployment. v0.14 adds branch/global operational settings, branch-scoped audit browsing, append-only
    audit storage and an authenticated notification inbox. v0.15 adds a dependency readiness probe for MySQL and 
    JMS alongside the process liveness endpoint.
servers:
- url: http://localhost:8080/smart-hospital-api/api/v1
security:
- basicAuth: []
paths:
  /health:
    get:
      summary: Authenticated API process liveness check
      responses:
        '200':
          description: Authenticated API process is responding; dependency readiness is reported separately at 
            /health/ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, const: UP}
                  application: {type: string}
                  timestamp: {type: string, format: date-time}
  /organization/branches:
    get:
      summary: List active hospital branches
      responses:
        '200':
          description: Branch list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Branch'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /organization/branches/{branchId}/departments:
    get:
      summary: List active departments for a branch
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Department list
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Department'}
        '404': {$ref: '#/components/responses/NotFound'}
  /organization/branches/{branchId}/doctors:
    get:
      summary: List active doctors for appointment booking
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - in: query
        name: departmentId
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Active doctors in the branch (optionally filtered by department)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DoctorOption'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /patients:
    post:
      summary: Register a patient
      description: Creates a patient and optional contact/allergy rows in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientRegistration'}
      responses:
        '201':
          description: Patient created
          headers:
            Location: {schema: {type: string, format: uri-reference}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Patient'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      summary: Search patients with pagination
      parameters:
      - in: query
        name: q
        schema: {type: string, maxLength: 100}
      - in: query
        name: offset
        schema: {type: integer, minimum: 0, default: 0}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Paginated patient summary list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatientPage'}
  /patients/{patientId}:
    parameters:
    - $ref: '#/components/parameters/PatientId'
    get:
      summary: Get patient demographics, contacts and allergies
      responses:
        '200':
          description: Patient detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Patient'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      summary: Update patient demographics
      description: Does not modify clinical notes, diagnoses, contacts or allergy history.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatientUpdate'}
      responses:
        '200':
          description: Updated patient detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Patient'}
        '404': {$ref: '#/components/responses/NotFound'}
  /appointments:
    get:
      summary: List appointments within a branch and time range
      description: Reception and managers can see branch appointments; a doctor sees only appointments assigned to their
        active staff profile. Patient branch grants are enforced.
      parameters:
      - in: query
        name: branchId
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: from
        required: true
        schema: {type: string, format: date-time}
      - in: query
        name: to
        required: true
        schema: {type: string, format: date-time}
      - in: query
        name: offset
        schema: {type: integer, minimum: 0, default: 0}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Branch-scoped paginated appointment schedule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AppointmentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Book an appointment
      description: The database exclusion constraint is the final guard against overlapping bookings for one doctor.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AppointmentCreate'}
      responses:
        '201':
          description: Appointment booked
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appointment'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /appointments/{appointmentId}:
    get:
      summary: Get an appointment
      parameters:
      - in: path
        name: appointmentId
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Appointment detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appointment'}
        '404': {$ref: '#/components/responses/NotFound'}
  /appointments/{appointmentId}/check-in:
    post:
      summary: Check in a booked or confirmed appointment
      description: Reception or hospital administrators check in the appointment. The backend serializes concurrent 
        check-in attempts with a pessimistic row lock.
      parameters:
      - in: path
        name: appointmentId
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Appointment checked in
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Appointment'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /patients/{patientId}/encounters:
    get:
      summary: List encounter history for a patient
      parameters:
      - $ref: '#/components/parameters/PatientId'
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Encounters visible in the caller's authorized branches
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Encounter'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /encounters:
    post:
      summary: Open a clinical encounter
      description: Only the authenticated active doctor can open an encounter. A linked appointment must match the 
        patient, doctor, department and branch and must be checked in.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EncounterCreate'}
      responses:
        '201':
          description: Encounter opened
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Encounter'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /encounters/{encounterId}:
    get:
      summary: Get a clinical encounter
      parameters:
      - $ref: '#/components/parameters/EncounterId'
      responses:
        '200':
          description: Encounter details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Encounter'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /encounters/{encounterId}/vitals:
    parameters:
    - $ref: '#/components/parameters/EncounterId'
    get:
      summary: List encounter vital-sign observations
      responses:
        '200':
          description: Vital-sign observations, newest first
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/VitalSign'}
    post:
      summary: Record a vital-sign observation
      description: Nurses and the attending doctor may record observations. At least one measurement is required; 
        recorded observations are append-only.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VitalSignCreate'}
      responses:
        '201':
          description: Vital-sign observation recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VitalSign'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /encounters/{encounterId}/notes:
    parameters:
    - $ref: '#/components/parameters/EncounterId'
    get:
      summary: List encounter clinical notes
      responses:
        '200':
          description: Notes with draft and signature status
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ClinicalNote'}
    post:
      summary: Create a clinical note draft
      description: Doctors may create clinical note types; nurses may create PROGRESS notes only. Authors sign their own
        drafts.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClinicalNoteCreate'}
      responses:
        '201':
          description: Draft note created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClinicalNote'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /encounters/{encounterId}/notes/{noteId}/sign:
    post:
      summary: Sign an authored draft clinical note
      parameters:
      - $ref: '#/components/parameters/EncounterId'
      - $ref: '#/components/parameters/NoteId'
      responses:
        '200':
          description: Signed note
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClinicalNote'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /encounters/{encounterId}/notes/{noteId}/amendments:
    post:
      summary: Create an amendment draft for a previously signed clinical note
      description: The attending doctor creates a new draft amendment referencing the signed original. The original note
        is never overwritten.
      parameters:
      - $ref: '#/components/parameters/EncounterId'
      - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ClinicalNoteCreate'}
      responses:
        '201':
          description: Amendment draft created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClinicalNote'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /encounters/{encounterId}/diagnoses:
    parameters:
    - $ref: '#/components/parameters/EncounterId'
    get:
      summary: List diagnoses recorded for the encounter
      responses:
        '200':
          description: Encounter diagnoses
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/EncounterDiagnosis'}
    post:
      summary: Record a diagnosis from the diagnosis catalog
      description: The attending doctor records a diagnosis. At most one primary diagnosis is allowed per encounter.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DiagnosisCreate'}
      responses:
        '201':
          description: Diagnosis recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EncounterDiagnosis'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /encounters/{encounterId}/diagnoses/{encounterDiagnosisId}:
    patch:
      summary: Update a recorded diagnosis clinical status
      parameters:
      - $ref: '#/components/parameters/EncounterId'
      - in: path
        name: encounterDiagnosisId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                clinicalStatus: {type: string, enum: [PROVISIONAL, CONFIRMED, RULED_OUT]}
              required: [clinicalStatus]
      responses:
        '200':
          description: Updated diagnosis status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EncounterDiagnosis'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /encounters/{encounterId}/complete:
    post:
      summary: Complete an active clinical encounter
      description: Only the attending doctor can complete the encounter. All draft notes must be signed. A linked 
        checked-in appointment is completed in the same transaction.
      parameters:
      - $ref: '#/components/parameters/EncounterId'
      responses:
        '200':
          description: Encounter completed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Encounter'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /encounters/{encounterId}/care-team:
    parameters:
    - $ref: '#/components/parameters/EncounterId'
    get:
      summary: List assigned nursing care-team members
      description: The attending doctor or a nurse already assigned to the encounter may view the care team.
      responses:
        '200':
          description: Care-team assignments
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/CareTeamAssignment'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Assign an active nurse to an encounter
      description: Only the attending doctor or hospital manager may assign a nurse. The assigned account must have the 
        NURSE role and belong to the same branch.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CareTeamAssignmentCreate'}
      responses:
        '201':
          description: Nurse assigned
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CareTeamAssignment'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /encounters/{encounterId}/care-team/{assignmentId}/release:
    post:
      summary: Release an active nursing assignment
      parameters:
      - $ref: '#/components/parameters/EncounterId'
      - $ref: '#/components/parameters/AssignmentId'
      responses:
        '200':
          description: Assignment released
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CareTeamAssignment'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /encounters/{encounterId}/lab-orders:
    parameters:
    - $ref: '#/components/parameters/EncounterId'
    get:
      summary: List laboratory orders for an encounter
      description: Only the attending doctor may view this encounter. Result values are included only after independent 
        laboratory review and release.
      responses:
        '200':
          description: Laboratory orders
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LabOrder'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a laboratory order
      description: Only the active attending doctor may order tests for an active encounter. Outbox events are committed
        with the order and later published through JMS.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LabOrderCreate'}
      responses:
        '201':
          description: Laboratory order created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabOrder'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /lab-tests:
    get:
      summary: Search active laboratory test catalogue
      parameters:
      - in: query
        name: q
        required: true
        schema: {type: string, minLength: 2, maxLength: 80}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Matching tests
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LabTest'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /lab-orders:
    get:
      summary: List laboratory orders in a selected authorized branch
      description: Only active laboratory technicians and supervisors assigned to the laboratory department may use this
        endpoint. The caller must have access to the branch.
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      - in: query
        name: status
        schema: {type: string, enum: [ORDERED, ACCEPTED, IN_PROGRESS, PARTIALLY_COMPLETED, COMPLETED, CANCELLED]}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: Laboratory work queue
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/LabOrder'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /lab-orders/items/{itemId}/collect:
    post:
      summary: Record specimen collection
      parameters:
      - $ref: '#/components/parameters/LabItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                specimenCode: {type: string, minLength: 1, maxLength: 48}
              required: [specimenCode]
      responses:
        '200':
          description: Specimen collected
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabOrderItem'}
        '409': {$ref: '#/components/responses/Conflict'}
  /lab-orders/items/{itemId}/start-processing:
    post:
      summary: Move a collected specimen into processing
      parameters:
      - $ref: '#/components/parameters/LabItemId'
      responses:
        '200':
          description: Processing started
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabOrderItem'}
        '409': {$ref: '#/components/responses/Conflict'}
  /lab-orders/items/{itemId}/result:
    post:
      summary: Record a laboratory result
      parameters:
      - $ref: '#/components/parameters/LabItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LabResultCreate'}
      responses:
        '200':
          description: Result recorded, awaiting independent review
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /lab-orders/items/{itemId}/review-release:
    post:
      summary: Independently review and release a laboratory result
      description: A LAB_SUPERVISOR different from the performer must review the result. Releasing the result creates a 
        transactional outbox event for JMS notification.
      parameters:
      - $ref: '#/components/parameters/LabItemId'
      responses:
        '200':
          description: Result reviewed and released
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LabResult'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /diagnoses:
    get:
      summary: Search active diagnosis catalog entries
      description: The current V004 development seed contains DEMO-only synthetic entries, not a real clinical 
        terminology.
      parameters:
      - in: query
        name: q
        required: true
        schema: {type: string, minLength: 2}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Matching catalog entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DiagnosisCatalogItem'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /medications:
    get:
      summary: Search the active medication catalogue
      description: Available to attending doctors and pharmacy users. Controlled medications are intentionally outside 
        this academic implementation.
      parameters:
      - in: query
        name: q
        required: true
        schema: {type: string, minLength: 2, maxLength: 80}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Matching active medication catalogue entries
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Medication'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /encounters/{encounterId}/prescriptions:
    parameters:
    - $ref: '#/components/parameters/EncounterId'
    get:
      summary: List prescriptions written for an encounter
      description: Only the attending doctor with active patient access may view encounter prescriptions.
      responses:
        '200':
          description: Encounter prescriptions and dispensed quantities
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Prescription'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a prescription for an active encounter
      description: Only the active attending doctor may prescribe. Each medication may appear once per prescription. 
        Controlled medications are out of scope; clinical dosing remains the clinician's responsibility.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PrescriptionCreate'}
      responses:
        '201':
          description: Prescription created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prescription'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /pharmacy/locations:
    get:
      summary: List active pharmacy inventory locations in an authorized branch
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      responses:
        '200':
          description: Pharmacy locations available to the pharmacist
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PharmacyLocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /pharmacy/stock:
    get:
      summary: List available medication stock
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      - in: query
        name: q
        schema: {type: string, minLength: 2, maxLength: 80}
      - in: query
        name: locationId
        schema: {type: string, format: uuid}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Available quantities from unexpired batches, optionally filtered to one pharmacy location
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/StockAvailability'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /pharmacy/prescriptions:
    get:
      summary: List active prescriptions waiting for pharmacy dispensing
      description: Only pharmacists assigned to the pharmacy department and current branch can use this queue. Patient 
        details are minimized to MRN and display name for dispensing workflow.
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      - in: query
        name: status
        schema: {type: string, enum: [ACTIVE, PARTIALLY_DISPENSED, DISPENSED, CANCELLED]}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: Branch-scoped prescription queue
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Prescription'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /pharmacy/prescriptions/{prescriptionId}/dispenses:
    post:
      summary: Dispense prescribed medication using FEFO batch allocation
      description: The pharmacist must belong to an active pharmacy department in the prescription branch. Quantity, 
        stock balances, dispense rows, stock movements and prescription status are committed in one transaction. Retries
        must use the same Idempotency-Key and identical payload.
      parameters:
      - in: path
        name: prescriptionId
        required: true
        schema: {type: string, format: uuid}
      - $ref: '#/components/parameters/BranchQueryId'
      - in: header
        name: Idempotency-Key
        required: true
        description: Client-generated key, 16–80 safe characters; reusing it with a different request returns 409.
        schema: {type: string, minLength: 16, maxLength: 80, pattern: '^[A-Za-z0-9._:-]+$'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DispenseCreate'}
      responses:
        '201':
          description: Dispense posted; repeated identical requests return the same dispense resource
          headers:
            Location: {schema: {type: string, format: uri-reference}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispense'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /pharmacy/dispenses/{dispenseId}:
    get:
      summary: Retrieve a posted dispense with its FEFO batch allocations
      parameters:
      - in: path
        name: dispenseId
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Posted dispense detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dispense'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admissions:
    post:
      summary: Admit a patient from an active inpatient or emergency encounter
      description: Creates an admission in one transaction and optionally assigns an initial bed. Doctors may admit only
        their own active encounter.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AdmissionCreate'}
      responses:
        '201':
          description: Admission created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Admission'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admissions/active:
    get:
      summary: List active admissions visible to the authenticated staff member
      parameters:
      - in: query
        name: branchId
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Active admissions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Admission'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admissions/beds:
    get:
      summary: List branch beds and their current occupancy state
      parameters:
      - in: query
        name: branchId
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: wardId
        schema: {type: string, format: uuid}
      - in: query
        name: availableOnly
        schema: {type: boolean, default: false}
      responses:
        '200':
          description: Bed inventory
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Bed'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admissions/{admissionId}/bed-assignments:
    post:
      summary: Assign an available bed to an active admission
      parameters:
      - in: path
        name: admissionId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BedAssign'}
      responses:
        '200':
          description: Admission with current bed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Admission'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admissions/{admissionId}/bed-transfers:
    post:
      summary: Transfer an admitted patient to another available bed
      parameters:
      - in: path
        name: admissionId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BedAssign'}
      responses:
        '200':
          description: Admission after bed transfer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Admission'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admissions/{admissionId}/discharge:
    post:
      summary: Discharge an active admission and release its current bed
      parameters:
      - in: path
        name: admissionId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Discharge'}
      responses:
        '200':
          description: Discharged admission
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Admission'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /billing/invoices:
    post:
      summary: Create a draft invoice for encounter services
      description: Prices are taken from the active service catalogue, not from client-supplied prices. This increment 
        bills service catalogue lines; medication charge integration is not yet included.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvoiceCreate'}
      responses:
        '201':
          description: Draft invoice
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      summary: List recent branch invoices
      parameters:
      - in: query
        name: branchId
        required: true
        schema: {type: string, format: uuid}
      - in: query
        name: status
        schema: {type: string, enum: [DRAFT, ISSUED, PARTIALLY_PAID, PAID, VOID]}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Invoices
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Invoice'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /billing/invoices/services:
    get:
      summary: Search active billable services for a branch
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      - in: query
        name: q
        schema: {type: string, minLength: 2, maxLength: 80}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Active services in the branch billing currency
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BillableService'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /billing/invoices/eligible-encounters:
    get:
      summary: Search encounters available for billing in a branch
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      - in: query
        name: q
        required: true
        schema: {type: string, minLength: 2, maxLength: 80}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: Non-cancelled encounters whose patients are accessible in the branch
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BillableEncounter'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /billing/invoices/{invoiceId}:
    get:
      summary: Retrieve invoice details and posted payments
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /billing/invoices/{invoiceId}/issue:
    post:
      summary: Issue a draft invoice after validating line totals
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Issued invoice
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /billing/invoices/{invoiceId}/payments:
    post:
      summary: Post a payment against an issued invoice
      description: The invoice row is locked during payment posting and database triggers prevent currency mismatch and 
        overpayment. Posted receipt records are immutable in this increment.
      parameters:
      - in: path
        name: invoiceId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PaymentCreate'}
      responses:
        '201':
          description: Invoice after payment posting
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Invoice'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /analytics/dashboard:
    get:
      summary: Read branch operational dashboard
      description: Returns aggregated, non-patient-identifying operational indicators for the branch-local calendar day.
        A read request does not write snapshots or generate decision cards.
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      responses:
        '200':
          description: Aggregated operational metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationalDashboard'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /analytics/dashboard/refresh:
    post:
      summary: Refresh metric snapshots and generate rule-based decision cards
      description: Management-only operation. Recalculates branch metrics, upserts daily snapshots and creates 
        explainable cards using configured warning thresholds. Repeated refreshes do not create duplicate cards for the 
        same branch and metric window.
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      responses:
        '200':
          description: Refreshed dashboard metrics
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationalDashboard'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /analytics/decision-cards:
    get:
      summary: List branch decision cards
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      - in: query
        name: openOnly
        schema: {type: boolean, default: true}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: Decision cards ordered by severity and generation time
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/DecisionCard'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /analytics/decision-cards/{cardId}/status:
    patch:
      summary: Change decision card workflow status
      parameters:
      - in: path
        name: cardId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DecisionCardStatusUpdate'}
      responses:
        '200':
          description: Updated decision card
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DecisionCard'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}

  /security/me:
    get:
      summary: Get the authenticated user's own hospital identity and branch memberships
      description: Returns only the caller's active database account mapping, role codes and assigned branch IDs. 
        Passwords and credential material are never returned.
      responses:
        '200':
          description: Current authenticated session
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentSession'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /procurement/suppliers:
    get:
      summary: Search active and inactive non-blocked suppliers
      parameters:
      - in: query
        name: q
        schema: {type: string, minLength: 2, maxLength: 80}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Supplier directory
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Supplier'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Register a supplier
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SupplierCreate'}
      responses:
        '201':
          description: Supplier created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Supplier'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /procurement/locations:
    get:
      summary: List active stock receiving locations in a branch
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      responses:
        '200':
          description: Main store and pharmacy locations
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/InventoryLocation'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /procurement/purchase-orders:
    get:
      summary: List branch purchase orders
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      - in: query
        name: status
        schema: {type: string, enum: [DRAFT, SUBMITTED, APPROVED, ORDERED, PARTIALLY_RECEIVED, RECEIVED, REJECTED, 
              CANCELLED]}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 100, default: 50}
      responses:
        '200':
          description: Purchase orders and line-level received quantities
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PurchaseOrder'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a draft purchase order
      description: Supplier and medication references are resolved by the backend. Prices and totals are calculated and 
        validated by the service and database.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseOrderCreate'}
      responses:
        '201':
          description: Draft purchase order created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /procurement/purchase-orders/{orderId}/submit:
    post:
      summary: Submit a draft purchase order for approval
      parameters:
      - in: path
        name: orderId
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Submitted purchase order
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /procurement/purchase-orders/{orderId}/approval:
    post:
      summary: Approve or reject a submitted purchase order
      parameters:
      - in: path
        name: orderId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PurchaseOrderApproval'}
      responses:
        '200':
          description: Updated purchase order approval status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /procurement/purchase-orders/{orderId}/order:
    post:
      summary: Mark an approved purchase order as sent to the supplier
      parameters:
      - in: path
        name: orderId
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Purchase order marked as ordered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PurchaseOrder'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /procurement/purchase-orders/{orderId}/receipts:
    post:
      summary: Receive goods and post accepted quantities to the stock ledger
      description: Each line is checked against the remaining ordered quantity. Accepted quantities require a batch and 
        future expiry date. Rejected quantities require a reason. Receipt, stock balances, movements and purchase-order 
        quantities commit atomically.
      parameters:
      - in: path
        name: orderId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GoodsReceiptCreate'}
      responses:
        '201':
          description: Goods receipt posted to inventory
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GoodsReceipt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}


  /accounting/accounts:
