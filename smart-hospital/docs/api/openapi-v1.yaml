  /admin/staff:
    get:
      summary: List staff members in an authorized branch
      description: Hospital administrators only. Search is limited to employee number, name and job title.
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      - in: query
        name: q
        schema: {type: string, maxLength: 80}
      - in: query
        name: status
        schema: {type: string, enum: [ACTIVE, ON_LEAVE, SUSPENDED, TERMINATED]}
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Staff directory for the selected branch
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/StaffMember'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Create a staff profile in an authorized branch
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffCreate'}
      responses:
        '201':
          description: Staff profile created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/staff/{staffId}:
    put:
      summary: Update staff profile and employment status
      parameters:
      - in: path
        name: staffId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StaffUpdate'}
      responses:
        '200':
          description: Updated staff profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StaffMember'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /admin/roles:
    get:
      summary: List defined hospital role codes
      responses:
        '200':
          description: Role catalogue; role codes must match GlassFish groups exactly
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/HospitalRole'}}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/accounts:
    get:
      summary: List accounts visible in an authorized branch
      parameters:
      - $ref: '#/components/parameters/BranchQueryId'
      - in: query
        name: limit
        schema: {type: integer, minimum: 1, maximum: 200, default: 100}
      responses:
        '200':
          description: Account summaries with only branch memberships visible to the current administrator
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/HospitalAccount'}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      summary: Map a pre-created GlassFish File Realm user to a staff profile
      description: The GlassFish principal and exact group list must be created outside the application first. The API 
        stores account, role and branch mappings only; it never stores or changes the user's password.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountProvision'}
      responses:
        '201':
          description: Hospital account mapping created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HospitalAccount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /admin/accounts/{accountId}/status:
    patch:
      summary: Enable or disable a hospital account globally
      description: A global change requires the administrator to have access to every branch assigned to the target 
        account. It does not create, delete or change the GlassFish File Realm password.
      parameters:
      - in: path
        name: accountId
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AccountStatusChange'}
      responses:
        '200':
          description: Updated hospital account status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HospitalAccount'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /system/settings:
    get:
      summary: List effective operational settings for an authorized branch
      parameters:
      - $ref: '#/components/parameters/BranchId'
      responses:
        '200':
          description: Effective setting values and their source
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemSetting'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      summary: Update a whitelisted global or branch-specific operational setting
      description: Global updates require HOSPITAL_ADMIN. Branch updates require HOSPITAL_ADMIN or HOSPITAL_MANAGER with
        branch access. Values are range-checked by the backend and audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSettingUpdate'
      responses:
        '200':
          description: Updated effective settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SystemSetting'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /audit-logs:
    get:
      summary: Search append-only audit events in one authorized branch
      parameters:
      - $ref: '#/components/parameters/BranchId'
      - in: query
        name: from
        schema:
          type: string
          format: date-time
        description: Inclusive ISO-8601 UTC start time.
      - in: query
        name: to
        schema:
          type: string
          format: date-time
        description: Inclusive ISO-8601 UTC end time.
      - in: query
        name: actionCode
        schema:
          type: string
          maxLength: 80
      - in: query
        name: resourceType
        schema:
          type: string
          maxLength: 80
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 30
      responses:
        '200':
          description: Branch-scoped audit page; clinical note text and patient content are not returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications:
    get:
      summary: List the authenticated user notification inbox
      parameters:
      - in: query
        name: unreadOnly
        schema:
          type: boolean
          default: false
      - in: query
        name: offset
        schema:
          type: integer
          minimum: 0
          default: 0
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: User-owned notifications only
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /notifications/unread-count:
    get:
      summary: Get the authenticated user unread notification count
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCount'
  /notifications/{notificationId}/read:
    post:
      summary: Mark one owned notification as read
      parameters:
      - in: path
        name: notificationId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCount'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/read-all:
    post:
      summary: Mark all notifications owned by the authenticated user as read
      responses:
        '200':
          description: Updated unread count and number marked read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCount'

  /health/ready:
    get:
      summary: Check database and JMS readiness
      description: Performs read-only probes against MySQL and the configured JMS connection factory. Returns HTTP 
        200 when both are available, otherwise HTTP 503. Dependency error details are intentionally not exposed.
      responses:
        '200':
          description: The application and required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadiness'
        '503':
          description: The application is running but one or more required dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadiness'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    BranchId:
      in: path
      name: branchId
      required: true
      schema: {type: string, format: uuid}
    BranchQueryId:
      in: query
      name: branchId
      required: true
      schema: {type: string, format: uuid}
    PatientId:
      in: path
      name: patientId
      required: true
      schema: {type: string, format: uuid}
    EncounterId:
      in: path
      name: encounterId
      required: true
      schema: {type: string, format: uuid}
    NoteId:
      in: path
      name: noteId
      required: true
      schema: {type: string, format: uuid}
    AssignmentId:
      in: path
      name: assignmentId
      required: true
      schema: {type: string, format: uuid}
    LabItemId:
      in: path
      name: itemId
      required: true
      schema: {type: string, format: uuid}
  responses:
    Unauthorized:
      description: Authentication required.
    Forbidden:
      description: Authenticated caller lacks the required role.
    BadRequest:
      description: Validation or business rule failure.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    Conflict:
      description: Unique, reference or scheduling conflict.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    CurrentSession:
      type: object
      properties:
        userId: {type: string, format: uuid}
        staffId: {type: [string, 'null'], format: uuid}
        username: {type: string}
        roleCodes:
          type: array
          items: {type: string}
        branchIds:
          type: array
          items: {type: string, format: uuid}
        defaultBranchId: {type: string, format: uuid}
      required: [userId, username, roleCodes, branchIds, defaultBranchId]
    Branch:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        timezone: {type: string}
        defaultCurrency: {type: string, minLength: 3, maxLength: 3}
        active: {type: boolean}
      required: [id, code, name, timezone, defaultCurrency, active]
    Department:
      type: object
      properties:
        id: {type: string, format: uuid}
        branchId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        departmentType: {type: string}
        active: {type: boolean}
      required: [id, branchId, code, name, departmentType, active]
    DoctorOption:
      type: object
      properties:
        staffId: {type: string, format: uuid}
        employeeNumber: {type: string}
        fullName: {type: string}
        departmentId: {type: [string, 'null'], format: uuid}
        departmentName: {type: [string, 'null']}
        specialty: {type: string}
      required: [staffId, employeeNumber, fullName, specialty]
    ContactInput:
      type: object
      properties:
        contactType: {type: string, enum: [PATIENT, EMERGENCY, GUARDIAN, OTHER]}
        contactName: {type: string, maxLength: 160}
        relationship: {type: string, maxLength: 60}
        phoneNumber: {type: string, maxLength: 32}
        email: {type: string, format: email, maxLength: 254}
        primary: {type: boolean, default: false}
      required: [contactType]
      anyOf:
      - required: [phoneNumber]
      - required: [email]
    AllergyInput:
      type: object
      properties:
        allergenName: {type: string, minLength: 1, maxLength: 160}
        reaction: {type: string, maxLength: 500}
        severity: {type: string, enum: [MILD, MODERATE, SEVERE, UNKNOWN]}
        verificationStatus: {type: string, enum: [UNVERIFIED, CONFIRMED, ENTERED_IN_ERROR]}
      required: [allergenName]
    PatientRegistration:
      type: object
      properties:
        branchId: {type: string, format: uuid, description: Defaults to caller default branch when omitted; caller must 
            hold branch access.}
        mrn: {type: string, minLength: 1, maxLength: 32}
        firstName: {type: string, minLength: 1, maxLength: 80}
        middleName: {type: string, maxLength: 80}
        lastName: {type: string, minLength: 1, maxLength: 80}
        dateOfBirth: {type: string, format: date}
        sex: {type: string, enum: [FEMALE, MALE, UNKNOWN, NOT_RECORDED]}
        bloodGroup: {type: string, enum: [A+, A-, B+, B-, AB+, AB-, O+, O-]}
        primaryPhone: {type: string, maxLength: 32}
        email: {type: string, format: email, maxLength: 254}
        addressText: {type: string, maxLength: 500}
        preferredLanguage: {type: string, maxLength: 8, default: ar}
        contacts:
          type: array
          maxItems: 10
          items: {$ref: '#/components/schemas/ContactInput'}
        allergies:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AllergyInput'}
      required: [mrn, firstName, lastName, sex]
    PatientUpdate:
      type: object
      properties:
        firstName: {type: string, minLength: 1, maxLength: 80}
        middleName: {type: string, maxLength: 80}
        lastName: {type: string, minLength: 1, maxLength: 80}
        dateOfBirth: {type: string, format: date}
        sex: {type: string, enum: [FEMALE, MALE, UNKNOWN, NOT_RECORDED]}
        bloodGroup: {type: string, enum: [A+, A-, B+, B-, AB+, AB-, O+, O-]}
        primaryPhone: {type: string, maxLength: 32}
        email: {type: string, format: email, maxLength: 254}
        addressText: {type: string, maxLength: 500}
        preferredLanguage: {type: string, maxLength: 8, default: ar}
      required: [firstName, lastName, sex]
    Patient:
      type: object
      properties:
        id: {type: string, format: uuid}
        mrn: {type: string}
        firstName: {type: string}
        middleName: {type: [string, 'null']}
        lastName: {type: string}
        dateOfBirth: {type: [string, 'null'], format: date}
        sex: {type: string}
        bloodGroup: {type: [string, 'null']}
        primaryPhone: {type: [string, 'null']}
        email: {type: [string, 'null']}
        addressText: {type: [string, 'null']}
        preferredLanguage: {type: string}
        status: {type: string}
        createdAt: {type: string, format: date-time}
        contacts: {type: array, items: {type: object}}
        allergies: {type: array, items: {type: object}}
    PatientPage:
      type: object
      properties:
        items: {type: array, items: {type: object}}
        total: {type: integer}
        offset: {type: integer}
        limit: {type: integer}
      required: [items, total, offset, limit]
    AppointmentListItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        branchId: {type: string, format: uuid}
        patientId: {type: string, format: uuid}
        patientMrn: {type: string}
        patientName: {type: string}
        doctorStaffId: {type: string, format: uuid}
        doctorName: {type: string}
        departmentId: {type: string, format: uuid}
        departmentName: {type: string}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        reason: {type: [string, 'null']}
        status: {type: string}
      required: [id, branchId, patientId, patientMrn, patientName, doctorStaffId, doctorName, departmentId, 
          departmentName, startsAt, endsAt, status]
    AppointmentPage:
      type: object
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/AppointmentListItem'}}
        total: {type: integer}
        offset: {type: integer}
        limit: {type: integer}
      required: [items, total, offset, limit]
    AppointmentCreate:
      type: object
      properties:
        branchId: {type: string, format: uuid}
        patientId: {type: string, format: uuid}
        doctorStaffId: {type: string, format: uuid}
        departmentId: {type: string, format: uuid}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        reason: {type: string, maxLength: 500}
      required: [branchId, patientId, doctorStaffId, departmentId, startsAt, endsAt]
    Appointment:
      type: object
      properties:
        id: {type: string, format: uuid}
        branchId: {type: string, format: uuid}
        patientId: {type: string, format: uuid}
        doctorStaffId: {type: string, format: uuid}
        departmentId: {type: string, format: uuid}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        reason: {type: [string, 'null']}
        status: {type: string}
        createdAt: {type: string, format: date-time}
    EncounterCreate:
      type: object
      properties:
        branchId: {type: string, format: uuid}
        patientId: {type: string, format: uuid}
        departmentId: {type: string, format: uuid}
        appointmentId: {type: [string, 'null'], format: uuid}
        encounterType: {type: string, enum: [OUTPATIENT, EMERGENCY, INPATIENT, FOLLOW_UP]}
        chiefComplaint: {type: [string, 'null'], maxLength: 1000}
      required: [branchId, patientId, departmentId, encounterType]
    Encounter:
      type: object
      properties:
        id: {type: string, format: uuid}
        branchId: {type: string, format: uuid}
        patientId: {type: string, format: uuid}
        appointmentId: {type: [string, 'null'], format: uuid}
        departmentId: {type: string, format: uuid}
        attendingDoctorId: {type: string, format: uuid}
        encounterType: {type: string, enum: [OUTPATIENT, EMERGENCY, INPATIENT, FOLLOW_UP]}
        status: {type: string, enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED]}
        chiefComplaint: {type: [string, 'null']}
        startedAt: {type: string, format: date-time}
        endedAt: {type: [string, 'null'], format: date-time}
    VitalSignCreate:
      type: object
      properties:
        temperatureC: {type: [number, 'null'], minimum: 25, maximum: 45}
        systolicMmhg: {type: [integer, 'null'], minimum: 20, maximum: 300}
        diastolicMmhg: {type: [integer, 'null'], minimum: 10, maximum: 200}
        pulseBpm: {type: [integer, 'null'], minimum: 1, maximum: 300}
        respiratoryRate: {type: [integer, 'null'], minimum: 1, maximum: 100}
        oxygenSaturation: {type: [number, 'null'], minimum: 0, maximum: 100}
        weightKg: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 1000}
        heightCm: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 300}
        notes: {type: [string, 'null'], maxLength: 500}
    VitalSign:
      allOf:
      - $ref: '#/components/schemas/VitalSignCreate'
      - type: object
        properties:
          id: {type: string, format: uuid}
          encounterId: {type: string, format: uuid}
          measuredBy: {type: string, format: uuid}
          measuredAt: {type: string, format: date-time}
    ClinicalNoteCreate:
      type: object
      properties:
        noteType: {type: string, enum: [HISTORY, EXAMINATION, ASSESSMENT, PLAN, PROGRESS, DISCHARGE, OTHER]}
        noteText: {type: string, minLength: 1, maxLength: 20000}
      required: [noteType, noteText]
    ClinicalNote:
      type: object
      properties:
        id: {type: string, format: uuid}
        encounterId: {type: string, format: uuid}
        authorStaffId: {type: string, format: uuid}
        noteType: {type: string}
        noteText: {type: string}
        noteStatus: {type: string, enum: [DRAFT, SIGNED, AMENDED]}
        createdAt: {type: string, format: date-time}
        signedAt: {type: [string, 'null'], format: date-time}
        amendedFromId: {type: [string, 'null'], format: uuid}
    DiagnosisCreate:
      type: object
      properties:
        diagnosisId: {type: string, format: uuid}
        primary: {type: boolean, default: false}
        clinicalStatus: {type: string, enum: [PROVISIONAL, CONFIRMED, RULED_OUT]}
      required: [diagnosisId, clinicalStatus]
    EncounterDiagnosis:
      type: object
      properties:
        id: {type: string, format: uuid}
        diagnosisId: {type: string, format: uuid}
        codeSystem: {type: string}
        diagnosisCode: {type: string}
        description: {type: string}
        primary: {type: boolean}
        clinicalStatus: {type: string, enum: [PROVISIONAL, CONFIRMED, RULED_OUT]}
        recordedAt: {type: string, format: date-time}
    DiagnosisCatalogItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        codeSystem: {type: string}
        diagnosisCode: {type: string}
        description: {type: string}
        active: {type: boolean}
    CareTeamAssignmentCreate:
      type: object
      properties:
        staffId: {type: string, format: uuid}
        careRole: {type: string, enum: [PRIMARY_NURSE, SUPPORT_NURSE]}
      required: [staffId, careRole]
    CareTeamAssignment:
      type: object
      properties:
        id: {type: string, format: uuid}
        encounterId: {type: string, format: uuid}
        staffId: {type: string, format: uuid}
        staffName: {type: string}
        careRole: {type: string, enum: [PRIMARY_NURSE, SUPPORT_NURSE]}
        assignedBy: {type: string, format: uuid}
        assignedAt: {type: string, format: date-time}
        releasedAt: {type: [string, 'null'], format: date-time}
    LabTest:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        specimenType: {type: [string, 'null']}
        resultUnit: {type: [string, 'null']}
        referenceRange: {type: [string, 'null']}
        standardPrice: {type: number}
        currencyCode: {type: string, minLength: 3, maxLength: 3}
        expectedMinutes: {type: [integer, 'null']}
    LabOrderCreate:
      type: object
      properties:
        priority: {type: string, enum: [ROUTINE, URGENT, STAT], default: ROUTINE}
        clinicalQuestion: {type: [string, 'null'], maxLength: 500}
        testIds:
          type: array
          minItems: 1
          maxItems: 25
          uniqueItems: true
          items: {type: string, format: uuid}
      required: [testIds]
    LabOrder:
      type: object
      properties:
        id: {type: string, format: uuid}
        encounterId: {type: string, format: uuid}
        orderedBy: {type: string, format: uuid}
        patientMrn: {type: string, maxLength: 32}
        patientDisplayName: {type: string, maxLength: 244}
        priority: {type: string, enum: [ROUTINE, URGENT, STAT]}
        status: {type: string, enum: [ORDERED, ACCEPTED, IN_PROGRESS, PARTIALLY_COMPLETED, COMPLETED, CANCELLED]}
        clinicalQuestion: {type: [string, 'null']}
        orderedAt: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/LabOrderItem'}
    LabOrderItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        testId: {type: string, format: uuid}
        testCode: {type: string}
        testName: {type: string}
        status: {type: string, enum: [PENDING, COLLECTED, PROCESSING, RESULTED, REVIEWED, CANCELLED]}
        specimenCode: {type: [string, 'null']}
        collectedAt: {type: [string, 'null'], format: date-time}
        collectedBy: {type: [string, 'null'], format: uuid}
        result: {anyOf: [$ref: '#/components/schemas/LabResult', type: 'null']}
    LabResultCreate:
      type: object
      properties:
        resultText: {type: [string, 'null'], maxLength: 4000}
        resultNumeric:
          type: [number, 'null']
          description: Must fit MySQL DECIMAL(16,5), with at most 11 integer and 5 fractional digits.
        resultUnit: {type: [string, 'null'], maxLength: 40}
        referenceRange: {type: [string, 'null'], maxLength: 120}
        abnormalFlag: {type: string, enum: [LOW, NORMAL, HIGH, CRITICAL, UNKNOWN], default: UNKNOWN}
    LabResult:
      type: object
      properties:
        id: {type: string, format: uuid}
        labOrderItemId: {type: string, format: uuid}
        resultText: {type: [string, 'null']}
        resultNumeric:
          type: [number, 'null']
          description: Must fit MySQL DECIMAL(16,5), with at most 11 integer and 5 fractional digits.
        resultUnit: {type: [string, 'null']}
        referenceRange: {type: [string, 'null']}
        abnormalFlag: {type: string, enum: [LOW, NORMAL, HIGH, CRITICAL, UNKNOWN]}
        performedBy: {type: [string, 'null'], format: uuid}
        reviewedBy: {type: [string, 'null'], format: uuid}
        performedAt: {type: [string, 'null'], format: date-time}
        reviewedAt: {type: [string, 'null'], format: date-time}
        releasedAt: {type: [string, 'null'], format: date-time}
    Medication:
      type: object
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        genericName: {type: string}
        brandName: {type: [string, 'null']}
        strength: {type: [string, 'null']}
        dosageForm: {type: [string, 'null']}
        route: {type: [string, 'null']}
        dispensingUnit: {type: string}
        controlled: {type: boolean}
      required: [id, code, genericName, dispensingUnit, controlled]
    PrescriptionCreate:
      type: object
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          items: {$ref: '#/components/schemas/PrescriptionItemCreate'}
      required: [items]
    PrescriptionItemCreate:
      type: object
      properties:
        medicationId: {type: string, format: uuid}
        dose: {type: string, minLength: 1, maxLength: 80}
        route: {type: [string, 'null'], maxLength: 60}
        frequency: {type: string, minLength: 1, maxLength: 100}
        durationDays: {type: [integer, 'null'], minimum: 1}
        quantityPrescribed: {type: number, exclusiveMinimum: 0, multipleOf: 0.001}
        instructions: {type: [string, 'null'], maxLength: 500}
      required: [medicationId, dose, frequency, quantityPrescribed]
    Prescription:
      type: object
      properties:
        id: {type: string, format: uuid}
        encounterId: {type: string, format: uuid}
        prescriberStaffId: {type: string, format: uuid}
        branchId: {type: string, format: uuid}
        patientMrn: {type: string}
        patientDisplayName: {type: string}
        status: {type: string, enum: [ACTIVE, PARTIALLY_DISPENSED, DISPENSED, CANCELLED]}
        orderedAt: {type: string, format: date-time}
        items:
          type: array
          items: {$ref: '#/components/schemas/PrescriptionItem'}
      required: [id, encounterId, prescriberStaffId, branchId, patientMrn, patientDisplayName, status, orderedAt, items]
    PrescriptionItem:
      type: object
      properties:
        id: {type: string, format: uuid}
        medicationId: {type: string, format: uuid}
        medicationCode: {type: string}
        medicationName: {type: string}
        brandName: {type: [string, 'null']}
        strength: {type: [string, 'null']}
        dosageForm: {type: [string, 'null']}
